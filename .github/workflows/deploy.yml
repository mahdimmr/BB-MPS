name: Deploy

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      app_image: ${{ steps.names.outputs.app }}
      migrate_image: ${{ steps.names.outputs.migrate }}
      tag: ${{ steps.names.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image names
        id: names
        run: |
          prefix="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "app=${prefix}/app" >> "$GITHUB_OUTPUT"
          echo "migrate=${prefix}/migrate" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runner
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.names.outputs.app }}:${{ steps.names.outputs.tag }}
            ${{ steps.names.outputs.app }}:latest
          cache-from: type=gha,scope=bbpms
          cache-to: type=gha,mode=max,scope=bbpms

      - name: Build and push migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: migrate
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.names.outputs.migrate }}:${{ steps.names.outputs.tag }}
            ${{ steps.names.outputs.migrate }}:latest
          cache-from: type=gha,scope=bbpms
          cache-to: type=gha,mode=max,scope=bbpms

  deploy:
    name: Deploy to production
    needs: build
    if: github.event_name != 'pull_request' && secrets.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure deploy directory exists
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_PATH
          script: mkdir -p "$DEPLOY_PATH/scripts"

      - name: Copy compose files to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: docker-compose.prod.yml,scripts/deploy.sh
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Pull images, migrate, and restart
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          APP_IMAGE: ${{ needs.build.outputs.app_image }}:${{ needs.build.outputs.tag }}
          MIGRATE_IMAGE: ${{ needs.build.outputs.migrate_image }}:${{ needs.build.outputs.tag }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_USERNAME,APP_IMAGE,MIGRATE_IMAGE,DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
